<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample App</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  input[type=text] { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
  li.done span { text-decoration: line-through; color: #888; }
  li button { margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 1.1rem; }
</style>
</head>
<body>
<h1>To-Do</h1>
<input id="new" type="text" maxlength="200" placeholder="Add a to-do and press Enter" autofocus>
<ul id="list"></ul>
<script>
const list = document.getElementById("list");
const input = document.getElementById("new");

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" },
                                  body: body && JSON.stringify(body) });
  return res.status === 204 ? null : res.json();
}

async function render() {
  list.replaceChildren(...(await api("GET", "/api/items")).map(item => {
    const li = document.createElement("li");
    li.className = item.done ? "done" : "";
    const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: item.done });
    box.onchange = async () => { await api("PATCH", `/api/items/${item.id}`, { done: box.checked }); render(); };
    const text = Object.assign(document.createElement("span"), { textContent: item.text });
    const remove = Object.assign(document.createElement("button"), { textContent: "×", title: "Remove" });
    remove.onclick = async () => { await api("DELETE", `/api/items/${item.id}`); render(); };
    li.append(box, text, remove);
    return li;
  }));
}

input.addEventListener("keydown", async e => {
  if (e.key !== "Enter" || !input.value.trim()) return;
  await api("POST", "/api/items", { text: input.value });
  input.value = "";
  render();
});

render();
</script>
</body>
</html>
